openapi: 3.0.3

info:
  title: Distributed KV Store API
  version: 1.0.0
  description: |
    REST API for a distributed key-value storage system with sharding.

    Clients communicate only with the coordinator.
    The coordinator uses the record key to determine the target shard
    and forwards the request to the appropriate storage node.

    The API provides table registration, record existence checks,
    CRUD operations for key-value records, and internal shard management.

servers:
  - url: http://localhost:8000
    description: Local coordinator


tags:
  - name: Tables
    description: Operations for registering and viewing table definitions

  - name: Items
    description: Operations on key-value records stored in registered tables

  - name: Composite key
    description: Operations on tables with a composite primary key (partition key + sort key)

  - name: Internal
    description: Internal operations for shard registration and cluster state


paths:

  /tables:
    post:
      tags:
        - Tables
      summary: Register a table
      description: |
        Registers a new logical table and defines the field
        used as its partition key.
      operationId: createTable

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableDefinition'
            example:
              name: users
              partition_key: id

      responses:
        '201':
          description: Table successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableDefinition'
              example:
                name: users
                partition_key: id

        '409':
          description: Table with the specified name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Table 'users' already exists

        '422':
          $ref: '#/components/responses/ValidationError'


    get:
      tags:
        - Tables
      summary: List registered tables
      description: |
        Returns all registered logical tables
        together with their partition key names.
      operationId: listTables

      responses:
        '200':
          description: Registered tables
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
              example:
                users: id
                orders: order_id


  /tables/{table}/items/{key}:

    parameters:
      - $ref: '#/components/parameters/Table'
      - $ref: '#/components/parameters/Key'


    head:
      tags:
        - Items
      summary: Check whether a record exists
      description: |
        Checks whether a record with the specified key exists.

        Returns 200 if the record exists and 404 otherwise.
        The operation does not return a response body.
      operationId: existsItem

      responses:
        '200':
          description: Record exists
          headers:
            X-Shard:
              $ref: '#/components/headers/X-Shard'

        '404':
          description: Table or record not found
          headers:
            X-Shard:
              $ref: '#/components/headers/X-Shard'


    put:
      tags:
        - Items
      summary: Create a record
      description: |
        Creates a new key-value record.

        The coordinator determines the target shard from the key
        and forwards the request to the corresponding storage node.

        If the key already exists, the existing value is not overwritten
        and the operation returns 409 Conflict.
      operationId: createItem

      requestBody:
        required: true
        description: JSON value associated with the specified key
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Value'
            example:
              name: Alice
              age: 22

      responses:
        '201':
          description: Record successfully created
          headers:
            X-Shard:
              $ref: '#/components/headers/X-Shard'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
              example:
                key: user1
                value:
                  name: Alice
                  age: 22
                shard: shard-1

        '404':
          $ref: '#/components/responses/TableNotFound'

        '409':
          $ref: '#/components/responses/KeyAlreadyExists'

        '422':
          $ref: '#/components/responses/ValidationError'


    get:
      tags:
        - Items
      summary: Read a record
      description: |
        Returns the value stored under the specified key.

        The coordinator determines the target shard from the key
        and forwards the read request to that shard.
      operationId: readItem

      responses:
        '200':
          description: Record successfully retrieved
          headers:
            X-Shard:
              $ref: '#/components/headers/X-Shard'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
              example:
                key: user1
                value:
                  name: Alice
                  age: 22
                shard: shard-1

        '404':
          $ref: '#/components/responses/NotFound'


    patch:
      tags:
        - Items
      summary: Update a record
      description: |
        Replaces the stored value of an existing record
        without changing its key.

        Since the key does not change, the record remains mapped
        to the same shard.

        Returns 404 if the table or key does not exist.
      operationId: updateItem

      requestBody:
        required: true
        description: New JSON value for the existing key
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Value'
            example:
              name: Alice
              age: 23

      responses:
        '200':
          description: Record successfully updated
          headers:
            X-Shard:
              $ref: '#/components/headers/X-Shard'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
              example:
                key: user1
                value:
                  name: Alice
                  age: 23
                shard: shard-1

        '404':
          $ref: '#/components/responses/NotFound'

        '422':
          $ref: '#/components/responses/ValidationError'


    delete:
      tags:
        - Items
      summary: Delete a record
      description: |
        Removes the key-value record identified by the specified key.

        The coordinator determines the target shard
        and forwards the delete request to that shard.
      operationId: deleteItem

      responses:
        '204':
          description: Record successfully deleted
          headers:
            X-Shard:
              $ref: '#/components/headers/X-Shard'

        '404':
          $ref: '#/components/responses/NotFound'


  /tables/{table}:
    get:
      tags:
        - Tables
      summary: Get a table definition
      description: Returns the partition key and, if defined, the sort key of the table.
      operationId: getTable
      parameters:
        - $ref: '#/components/parameters/Table'
      responses:
        '200':
          description: Table definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableDefinition'
              example:
                name: orders
                partition_key: user_id
                sort_key: order_date
        '404':
          $ref: '#/components/responses/TableNotFound'


  /tables/{table}/items/{key}/{sort_key}:

    parameters:
      - $ref: '#/components/parameters/Table'
      - $ref: '#/components/parameters/Key'
      - $ref: '#/components/parameters/SortKey'

    head:
      tags:
        - Composite key
      summary: Check whether a record with a composite key exists
      operationId: existsCompositeItem
      responses:
        '200':
          description: Record exists
          headers:
            X-Shard:
              $ref: '#/components/headers/X-Shard'
        '404':
          description: Table or record not found

    put:
      tags:
        - Composite key
      summary: Create a record with a composite key
      description: |
        The shard is chosen only by the partition key, so all records
        of one partition are stored on the same shard.
        If the record already exists, the operation returns 409 Conflict.
      operationId: createCompositeItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Value'
            example:
              product: Laptop
              total: 1200
      responses:
        '201':
          description: Record successfully created
          headers:
            X-Shard:
              $ref: '#/components/headers/X-Shard'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
              example:
                key: alice
                sort_key: 2026-10-01
                value:
                  product: Laptop
                  total: 1200
                shard: shard-0
        '400':
          $ref: '#/components/responses/WrongKeyShape'
        '404':
          $ref: '#/components/responses/TableNotFound'
        '409':
          $ref: '#/components/responses/KeyAlreadyExists'
        '422':
          $ref: '#/components/responses/ValidationError'

    get:
      tags:
        - Composite key
      summary: Read a record with a composite key
      operationId: readCompositeItem
      responses:
        '200':
          description: Record successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/WrongKeyShape'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Composite key
      summary: Update a record with a composite key
      operationId: updateCompositeItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Value'
      responses:
        '200':
          description: Record successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/WrongKeyShape'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Composite key
      summary: Delete a record with a composite key
      operationId: deleteCompositeItem
      responses:
        '204':
          description: Record successfully deleted
        '400':
          $ref: '#/components/responses/WrongKeyShape'
        '404':
          $ref: '#/components/responses/NotFound'


  /tables/{table}/partitions/{key}:
    get:
      tags:
        - Composite key
      summary: Query a partition
      description: |
        Returns all records of one partition sorted by sort key.
        The optional sk_from and sk_to parameters limit the range of sort keys (inclusive).
      operationId: queryPartition
      parameters:
        - $ref: '#/components/parameters/Table'
        - $ref: '#/components/parameters/Key'
        - name: sk_from
          in: query
          required: false
          description: Lowest sort key of the range
          schema:
            type: string
          example: 2026-10-01
        - name: sk_to
          in: query
          required: false
          description: Highest sort key of the range
          schema:
            type: string
          example: 2026-10-31
      responses:
        '200':
          description: Records of the partition sorted by sort key
          headers:
            X-Shard:
              $ref: '#/components/headers/X-Shard'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partition'
        '400':
          $ref: '#/components/responses/WrongKeyShape'
        '404':
          $ref: '#/components/responses/TableNotFound'


  /internal/shards:

    post:
      tags:
        - Internal
      summary: Register a shard
      description: |
        Registers a storage shard in the coordinator.

        This endpoint is intended for internal service communication.
        A shard calls it during startup to announce its identifier
        and internal service URL.

        If a shard with the same identifier is already registered,
        its URL is updated.
      operationId: registerShard

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Shard'
            example:
              id: shard-0
              url: http://shard0:8000

      responses:
        '200':
          description: Shard successfully registered or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShardRegistration'
              example:
                status: registered
                shards:
                  - id: shard-0
                    url: http://shard0:8000
                  - id: shard-1
                    url: http://shard1:8000

        '422':
          $ref: '#/components/responses/ValidationError'


    get:
      tags:
        - Internal
      summary: Get cluster state
      description: |
        Returns the current operating mode of the coordinator
        and the list of registered storage shards.
      operationId: listShards

      responses:
        '200':
          description: Current cluster state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterState'
              example:
                mode: sharded
                shards:
                  - id: shard-0
                    url: http://shard0:8000
                  - id: shard-1
                    url: http://shard1:8000


components:

  parameters:

    Table:
      name: table
      in: path
      required: true
      description: Name of the registered logical table
      schema:
        type: string
        minLength: 1
      example: users


    Key:
      name: key
      in: path
      required: true
      description: |
        Value of the partition key used to identify the record
        and determine the target shard.
      schema:
        type: string
        minLength: 1
      example: user1


    SortKey:
      name: sort_key
      in: path
      required: true
      description: Value of the sort key that orders records inside a partition
      schema:
        type: string
        minLength: 1
      example: 2026-10-01


  headers:

    X-Shard:
      description: |
        Identifier of the shard that processed the request.
        The value is "local" when the system operates in single-node mode.
      schema:
        type: string
      example: shard-1


  schemas:

    TableDefinition:
      type: object
      required:
        - name
        - partition_key

      properties:

        name:
          type: string
          minLength: 1
          description: Unique name of the logical table
          example: users

        partition_key:
          type: string
          minLength: 1
          description: |
            Name of the field used as the partition key.

            The value of this key is used by the coordinator
            to determine the target shard for a record.
          example: id

        sort_key:
          type: string
          minLength: 1
          description: |
            Optional name of the sort key field.
            If set, records are addressed by partition key and sort key,
            and records of one partition are sorted by the sort key.
          example: order_date


    Value:
      description: |
        Arbitrary JSON value associated with a record key.

        The storage system treats the value as application data.
        Its internal structure does not affect shard selection.


    Item:
      type: object
      required:
        - key
        - value
        - shard

      properties:

        key:
          type: string
          minLength: 1
          description: Record key (partition key value)
          example: user1

        sort_key:
          type: string
          description: Sort key value, present only for tables with a sort key
          example: 2026-10-01

        value:
          $ref: '#/components/schemas/Value'

        shard:
          type: string
          description: |
            Identifier of the shard that stores the record.
            The value is "local" in single-node mode.

            This field is exposed primarily for observing
            and debugging sharding behavior.
          example: shard-1


    PartitionItem:
      type: object
      required:
        - sort_key
        - value
      properties:
        sort_key:
          type: string
          example: 2026-10-01
        value:
          $ref: '#/components/schemas/Value'


    Partition:
      type: object
      required:
        - partition_key
        - shard
        - items
      properties:
        partition_key:
          type: string
          example: alice
        shard:
          type: string
          example: shard-0
        items:
          type: array
          description: Records sorted by sort key
          items:
            $ref: '#/components/schemas/PartitionItem'


    Shard:
      type: object
      required:
        - id
        - url

      properties:

        id:
          type: string
          minLength: 1
          description: Unique identifier of the storage shard
          example: shard-0

        url:
          type: string
          format: uri
          description: Internal URL of the shard service
          example: http://shard0:8000


    ShardRegistration:
      type: object
      required:
        - status
        - shards

      properties:

        status:
          type: string
          enum:
            - registered
            - updated
          description: Result of the shard registration operation

        shards:
          type: array
          description: Currently registered shards
          items:
            $ref: '#/components/schemas/Shard'


    ClusterState:
      type: object
      required:
        - mode
        - shards

      properties:

        mode:
          type: string
          enum:
            - single-node
            - sharded
          description: Current operating mode of the coordinator

        shards:
          type: array
          description: Currently registered storage shards
          items:
            $ref: '#/components/schemas/Shard'


    Error:
      type: object
      required:
        - detail

      properties:

        detail:
          type: string
          description: Human-readable description of the error
          example: Key not found


    ValidationErrorDetail:
      type: object
      required:
        - detail

      properties:

        detail:
          type: array
          description: Validation errors detected in the request
          items:
            type: object
            required:
              - loc
              - msg
              - type

            properties:

              loc:
                type: array
                description: Location of the invalid field
                items:
                  oneOf:
                    - type: string
                    - type: integer

              msg:
                type: string
                description: Human-readable validation message

              type:
                type: string
                description: Validation error type


  responses:

    NotFound:
      description: Requested table or record was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: Key 'user1' not found


    TableNotFound:
      description: Requested table is not registered
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: Table 'orders' is not registered


    WrongKeyShape:
      description: |
        The key does not match the table definition: a sort key is missing
        for a table with a sort key, or given for a table without it
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: Table 'orders' has a sort key, use /items/{key}/{sort_key}


    KeyAlreadyExists:
      description: Record with the specified key already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: Key 'user1' already exists


    ValidationError:
      description: Request data does not satisfy API validation rules
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorDetail'
          example:
            detail:
              - loc:
                  - body
                  - name
                msg: Field required
                type: missing