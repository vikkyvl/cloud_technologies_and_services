name: Deploy Lab 2 KV store

on:
  push:
    branches: [main]
    paths:
      - "lab2/kv-store/**"
      - ".github/workflows/deploy-lab2.yml"
  workflow_dispatch:          # manual run from the Actions tab

permissions:
  id-token: write             # needed to get an OIDC token for AWS
  contents: read

env:
  AWS_REGION: eu-north-1
  APP_DIR: lab2/kv-store

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r $APP_DIR/coordinator/requirements.txt

      - name: Import check of both services
        run: |
          (cd $APP_DIR/coordinator && python -c "import app.main")
          (cd $APP_DIR/shard && python -c "import app.main")

      - name: Consistent hashing comparison (if present)
        run: |
          if [ -f $APP_DIR/tests/rehash_compare.py ]; then
            python $APP_DIR/tests/rehash_compare.py
          else
            echo "rehash_compare.py not found, skipping"
          fi

      - name: Build Docker images
        run: docker compose -f $APP_DIR/docker-compose.yml build

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run deploy commands on the instance via SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          # commands executed on the instance as root
          cat > params.json <<'JSON'
          {"commands": [
            "set -e",
            "cd /opt/app",
            "git fetch origin main",
            "git reset --hard origin/main",
            "cd /opt/app/lab2/kv-store",
            "docker compose up -d --build --remove-orphans",
            "sleep 15",
            "docker compose ps",
            "curl -s http://localhost:8000/internal/shards"
          ]}
          JSON

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${GITHUB_SHA::7}" \
            --parameters file://params.json \
            --query "Command.CommandId" --output text)
          echo "SSM command: $CMD_ID"

          # wait up to 10 minutes for the command to finish
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" --query "Status" --output text 2>/dev/null || echo Pending)
            echo "Status: $STATUS"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text
          test "$STATUS" = "Success"